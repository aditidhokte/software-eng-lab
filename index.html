<!DOCTYPE html>
<html>
<head>
    <title>Digital Bookstore</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
        } 
        .book {
            background: white;
            width: 250px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
        }
        button {
            background: blue;
            color: white;
            padding: 10px;
            border: 0;
        }
    </style>
 </head>

<body>
    <h1>Digital Bookstore</h1>

    <div class="book">
        <h2>Software Engineering</h2>
        <p>Author: Roger Pressman</p>
        <p>Price: ₹500</p>
        <button>Buy Now</button>
    </div>
</body>
 </html>
